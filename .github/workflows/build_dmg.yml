name: Build macOS DMG Installers

on:
  push:
    branches: [ "macos", "main" ]
  pull_request:
    branches: [ "macos", "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Run Test Suite
      run: |
        dotnet run --project tests/EngineTests.csproj

    - name: Build and Package Full & Lite DMGs
      run: |
        chmod +x build_macos.sh
        ./build_macos.sh all

    - name: Upload Full Apple Silicon DMG
      uses: actions/upload-artifact@v4
      with:
        name: Agilico_MSP_Toolkit_arm64.dmg
        path: publish_output/Agilico_MSP_Toolkit_arm64.dmg

    - name: Upload Full Intel Mac DMG
      uses: actions/upload-artifact@v4
      with:
        name: Agilico_MSP_Toolkit_x64.dmg
        path: publish_output/Agilico_MSP_Toolkit_x64.dmg

    - name: Upload Lite Apple Silicon DMG
      uses: actions/upload-artifact@v4
      with:
        name: Agilico_MSP_Toolkit_Lite_arm64.dmg
        path: publish_output/Agilico_MSP_Toolkit_Lite_arm64.dmg

    - name: Upload Lite Intel Mac DMG
      uses: actions/upload-artifact@v4
      with:
        name: Agilico_MSP_Toolkit_Lite_x64.dmg
        path: publish_output/Agilico_MSP_Toolkit_Lite_x64.dmg

    - name: Publish DMGs to GitHub Release
      if: github.ref == 'refs/heads/macos' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release view v4.1.2 >/dev/null 2>&1 || gh release create v4.1.2 --title "v4.1.2 - Agilico MSP Toolkit" --notes "Agilico MSP Toolkit v4.1.2 macOS DMG Installers (Full & Lite Editions for Apple Silicon & Intel Mac)"
        gh release upload v4.1.2 publish_output/*.dmg --clobber
