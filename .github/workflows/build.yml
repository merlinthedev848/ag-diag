name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Ensure FFmpeg asset
        shell: pwsh
        run: |
          $needsFetch = $false
          if (-not (Test-Path "ffmpeg.exe")) {
            $needsFetch = $true
          } elseif ((Get-Item "ffmpeg.exe").Length -lt 1000000) {
            Write-Host "ffmpeg.exe is currently an LFS pointer (size: $((Get-Item ffmpeg.exe).Length) bytes)."
            $needsFetch = $true
          }

          if ($needsFetch) {
            Write-Host "Attempting git lfs pull..."
            try {
              git lfs pull
            } catch {
              Write-Warning "git lfs pull encountered an issue: $_"
            }
          }

          # Fallback if Git LFS bandwidth is exceeded on GitHub
          if (-not (Test-Path "ffmpeg.exe") -or (Get-Item "ffmpeg.exe").Length -lt 1000000) {
            Write-Host "Downloading fallback FFmpeg binary from release..."
            $zipPath = "$env:TEMP\ffmpeg.zip"
            $extractPath = "$env:TEMP\ffmpeg_extracted"
            Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile $zipPath -UseBasicParsing
            Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force
            $bin = Get-ChildItem -Path $extractPath -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
            if ($bin) {
              Copy-Item $bin.FullName -Destination "ffmpeg.exe" -Force
            }
            Remove-Item $zipPath -Force -ErrorAction SilentlyContinue
            Remove-Item $extractPath -Recurse -Force -ErrorAction SilentlyContinue
          }

          $actual = (Get-Item "ffmpeg.exe" -ErrorAction SilentlyContinue)?.Length
          Write-Host "FFmpeg asset ready: $actual bytes"

      - name: Restore
        run: dotnet restore agilicomsptoolkit.csproj

      - name: Build Release
        shell: pwsh
        run: dotnet build agilicomsptoolkit.csproj --configuration Release --no-restore --nologo -bl:build.binlog
        continue-on-error: false

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: build.binlog
          if-no-files-found: ignore

      - name: Restore tests
        run: dotnet restore tests/AgilicoToolkit.Tests/AgilicoToolkit.Tests.csproj

      - name: Run regression tests
        run: dotnet test tests/AgilicoToolkit.Tests/AgilicoToolkit.Tests.csproj --configuration Release --no-restore --verbosity normal

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          try {
            dotnet tool install --global wix --ignore-failed-sources
          } catch {
            dotnet tool update --global wix
          }
          $wixTools = Join-Path $HOME ".dotnet\tools"
          if (Test-Path $wixTools) {
            echo "$wixTools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            $env:PATH = "$wixTools;$env:PATH"
          }

      - name: Build All Distributions and MSI Installers
        shell: pwsh
        run: .\publish.ps1

      - name: Upload Release Binaries & Installers
        uses: actions/upload-artifact@v4
        with:
          name: agilico-msp-toolkit-installers
          path: publish_output/
          if-no-files-found: warn

      - name: Verify repository does not contain generated dumps
        shell: pwsh
        run: |
          $forbidden = @('patch.diff', 'scratch_dump.txt', 'static_resources.txt')
          foreach ($path in $forbidden) {
            if (Test-Path $path) { throw "Generated artifact is tracked: $path" }
          }
